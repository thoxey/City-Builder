families:
  - id: victorian_industrial_residential_01
    request: "Victorian industrial residential background family"
    size: 8
    unique_model_per_variant: true
    invariants:
      neighbourhood_family: victorian_industrial
      use: residential
      typology: terrace
      attachment: terrace
      storeys: [2, 3]
      primary_materials: [red_brick, brown_brick, local_stone, painted_render]
      roof_material: slate
      roof_orientation: ridge_parallel_to_street
      camera: orthographic_isometric_front_three_quarter
      mesh_profile: strict
    variants:
      - plain_2_bay_mid_terrace
      - wider_3_bay_mid_terrace
      - local_stone_variant
      - painted_weathered_variant
      - modest_bay_window_variant
      - darker_brick_variant
      - restrained_decorative_variant
      - end_terrace_with_visible_side

